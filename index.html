<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit Chains</title>
  <style>
    :root{
      --bg0:#070a12;
      --bg1:#0b1022;

      --panel: rgba(255,255,255,.04);
      --panel2: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.08);

      --text:#e5e7eb;
      --muted:#94a3b8;

      --rowA: rgba(255,255,255,.015);
      --rowB: rgba(255,255,255,.035);

      --dotOff: rgba(255,255,255,.10);
      --dotStroke: rgba(255,255,255,.18);

      /* streak tier colors */
      --c1:#3b82f6;   /* 1–6 */
      --c2:#22c55e;   /* 7–13 */
      --c3:#f59e0b;   /* 14–29 */
      --c4:#a855f7;   /* 30+ */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(59,130,246,.18), transparent 55%),
        radial-gradient(900px 700px at 90% 20%, rgba(168,85,247,.14), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg0));
      display:flex;
      justify-content:center;
      padding:24px;
    }

    .app{ width:min(1180px, 100%); }

    .topbar{
      display:flex;
      gap:16px;
      justify-content:space-between;
      align-items:flex-end;
      margin-bottom:14px;
    }

    .title{ display:flex; flex-direction:column; gap:6px; }
    h1{
      margin:0;
      font-weight:650;
      letter-spacing:.2px;
      font-size:22px;
    }
    .subtitle{ color:var(--muted); font-size:14px; }

    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .seg{
      display:flex;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      overflow:hidden;
    }
    .seg button{
      border:0;
      background:transparent;
      color:var(--muted);
      padding:9px 12px;
      font-size:13px;
      cursor:pointer;
    }
    .seg button.active{ background:var(--panel2); color:var(--text); }

    .add{
      display:flex;
      gap:8px;
      align-items:center;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      padding:9px;
    }
    .add input{
      width:280px;
      max-width:52vw;
      background:transparent;
      border:0;
      outline:none;
      color:var(--text);
      font-size:14px;
    }
    .add input::placeholder{color:rgba(148,163,184,.8)}
    .add button{
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      padding:8px 12px;
      border-radius:12px;
      font-size:13px;
      cursor:pointer;
    }
    .add button:hover{filter:brightness(1.1)}

    .board{
      border:1px solid var(--border);
      background:rgba(255,255,255,.03);
      border-radius:18px;
      overflow:hidden;
    }

    .grid{ display:grid; grid-template-columns: 250px 1fr; }

    .leftHead{
      padding:16px 16px 12px 16px;
      border-right:1px solid var(--border);
      background:rgba(0,0,0,.12);
    }
    .rangeLabel{ font-size:13px; color:var(--muted); line-height:1.35; }

    .datesWrap{
      overflow:auto hidden;
      border-bottom:1px solid var(--border);
      background:rgba(0,0,0,.12);
      scrollbar-width:thin;
    }

    /* header row (days) */
    .datesRow{
      display:grid;
      align-items:center;
      padding:12px 10px;
      min-width:max-content; /* overridden for 7/14 to stretch */
      gap:0;
    }

    /* body rows (dots) */
    .row{
      display:grid;
      align-items:center;
      padding:10px 10px;
      min-width:max-content; /* overridden for 7/14 to stretch */
      gap:0;
    }

    /* Each day column uses this size unless we switch to "fill" mode */
    .datesRow, .row{
      grid-auto-flow:column;
      grid-auto-columns: 52px; /* bigger */
    }

    /* When range is small, fill the available width (no empty right gap) */
    .fillCols .datesRow,
    .fillCols .row{
      width:100%;
      min-width:0;
      grid-auto-columns: 1fr;
    }

    .dayCell{ text-align:center; padding:0 6px; }
    .dow{
      font-size:12px;
      color:var(--muted);
      letter-spacing:.35px;
      margin-bottom:5px;
      text-transform:uppercase;
    }
    .md{ font-size:13px; color:var(--text); }
    .today{ position:relative; }
    .today::after{
      content:"";
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:-10px;
      width:22px;
      height:2px;
      border-radius:2px;
      background:rgba(229,231,235,.75);
    }

    /* habit row */
    .habitRow{
      display:grid;
      grid-template-columns: 250px 1fr;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .habitRow:nth-child(odd){ background: var(--rowA); }
    .habitRow:nth-child(even){ background: var(--rowB); }

    .habitCell{
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-right:1px solid var(--border);
      background:rgba(0,0,0,.10);
    }
    .habitName{
      font-size:15px;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .habitBtns{ display:flex; gap:8px; }
    .iconBtn{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      color:var(--muted);
      border-radius:12px;
      padding:7px 10px;
      font-size:13px;
      cursor:pointer;
    }
    .iconBtn:hover{filter:brightness(1.15); color:var(--text)}

    .cellsWrap{
      overflow:auto hidden;
      scrollbar-width:thin;
      touch-action:pan-x;
    }

    .cell{
      display:flex;
      justify-content:center;
      align-items:center;
      height:44px;
    }

    .dot{
      width:18px;
      height:18px;
      border-radius:999px;
      border:1px solid var(--dotStroke);
      background:var(--dotOff);
      cursor:pointer;
      transition: transform .06s ease, filter .10s ease, background .10s ease, border-color .10s ease;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none; /* lets pointer-drag paint */
    }
    .dot:hover{ transform:scale(1.08); filter:brightness(1.12); }

    .filled.t1{ background: color-mix(in oklab, var(--c1) 70%, transparent); border-color: color-mix(in oklab, var(--c1) 75%, white 0%); }
    .filled.t2{ background: color-mix(in oklab, var(--c2) 70%, transparent); border-color: color-mix(in oklab, var(--c2) 75%, white 0%); }
    .filled.t3{ background: color-mix(in oklab, var(--c3) 70%, transparent); border-color: color-mix(in oklab, var(--c3) 75%, white 0%); }
    .filled.t4{ background: color-mix(in oklab, var(--c4) 70%, transparent); border-color: color-mix(in oklab, var(--c4) 75%, white 0%); }

    .emptyState{
      padding:18px 16px;
      color:var(--muted);
      font-size:14px;
      border-top:1px solid rgba(255,255,255,.06);
    }

    @media (max-width: 760px){
      .grid, .habitRow{ grid-template-columns: 190px 1fr; }
      .add input{ width:170px; }
      .datesRow, .row{ grid-auto-columns: 46px; }
      .dot{ width:16px; height:16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">
        <h1>Habit Chains</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>

      <div class="controls">
        <div class="seg">
          <button id="r7" type="button">7d</button>
          <button id="r14" type="button">14d</button>
          <button id="r30" type="button">30d</button>
        </div>

        <div class="add">
          <input id="habitInput" placeholder="Add a habit (e.g. Run)" maxlength="40" />
          <button id="addBtn" type="button">Add</button>
        </div>
      </div>
    </div>

    <div class="board" id="board">
      <div class="grid">
        <div class="leftHead">
          <div class="rangeLabel" id="rangeLabel"></div>
        </div>
        <div class="datesWrap">
          <div class="datesRow" id="datesRow"></div>
        </div>
      </div>

      <div id="rows"></div>

      <div class="emptyState" id="emptyState" style="display:none;">
        No habits yet. Add one above to start your chain.
      </div>
    </div>
  </div>

<script>
  const STORE_KEY = "habit_chains_v2";

  // ---------- storage ----------
  function loadStore(){
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return { habits: [], checks: {}, rangeDays: 14 };
      const parsed = JSON.parse(raw);
      return {
        habits: Array.isArray(parsed.habits) ? parsed.habits : [],
        checks: parsed.checks && typeof parsed.checks === "object" ? parsed.checks : {},
        rangeDays: [7,14,30].includes(parsed.rangeDays) ? parsed.rangeDays : 14
      };
    } catch {
      return { habits: [], checks: {}, rangeDays: 14 };
    }
  }
  function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

  let store = loadStore();

  // ---------- date helpers ----------
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function pad2(n){ return String(n).padStart(2,"0"); }
  function startOfDay(date){ return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
  function addDays(date, delta){ const d = new Date(date); d.setDate(d.getDate() + delta); return d; }
  function toKey(date){ return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`; }

  function getDateWindow(days){
    const today = startOfDay(new Date());
    const list = [];
    for(let i = days-1; i >= 0; i--) list.push(addDays(today, -i));
    return list;
  }

  function formatRangeLabel(days){
    const today = startOfDay(new Date());
    const start = addDays(today, -(days-1));
    const s = `${MONTH[start.getMonth()]} ${start.getDate()}`;
    const e = `${MONTH[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;
    return `${s} → ${e} (${days} days, ending today)`;
  }

  function formatSubtitle(){
    const now = new Date();
    const weekday = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][now.getDay()];
    const monthName = ["January","February","March","April","May","June","July","August","September","October","November","December"][now.getMonth()];
    return `${weekday}, ${monthName} ${now.getDate()}`;
  }

  // ---------- chain coloring ----------
  function tierFromLen(len){
    if(len >= 30) return "t4";
    if(len >= 14) return "t3";
    if(len >= 7)  return "t2";
    if(len >= 1)  return "t1";
    return null;
  }

  // True segment length across all time:
  // For each visible checked day, find its full contiguous segment (scan back/forward),
  // compute tier from total segment length, apply to visible dots in that segment.
  function computeSegmentTiers(habitId, dates){
    const checkedSet = store.checks[habitId] || {};
    const tiers = {}; // dateKey -> "tNN" for visible checked days only

    function isChecked(dateObj){
      const k = toKey(dateObj);
      return !!checkedSet[k];
    }

    function findSegmentBounds(seedDate){
      // walk backward
      let start = startOfDay(seedDate);
      while(true){
        const prev = addDays(start, -1);
        if(!isChecked(prev)) break;
        start = prev;
      }
      // walk forward
      let end = startOfDay(seedDate);
      while(true){
        const next = addDays(end, +1);
        if(!isChecked(next)) break;
        end = next;
      }
      return { start, end };
    }

    const seenSegments = new Set();

    for(let i = 0; i < dates.length; i++){
      const d = dates[i];
      const k = toKey(d);
      if(!checkedSet[k]) continue;

      const { start, end } = findSegmentBounds(d);
      const segKey = toKey(start) + "|" + toKey(end);
      if(seenSegments.has(segKey)) continue;
      seenSegments.add(segKey);

      const len = Math.round((startOfDay(end) - startOfDay(start)) / (24*60*60*1000)) + 1;
      const tier = tierFromLen(len);

      // Apply only to visible dates inside this segment
      for(let j = 0; j < dates.length; j++){
        const vd = dates[j];
        const vk = toKey(vd);
        if(!checkedSet[vk]) continue;
        if(vd >= start && vd <= end){
          tiers[vk] = tier;
        }
      }
    }

    return tiers;
  }

  // ---------- habits ----------
  function addHabit(name){
    const trimmed = name.trim();
    if(!trimmed) return;

    const id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    store.habits.push({ id, name: trimmed });
    store.checks[id] = store.checks[id] || {};
    saveStore();
    render();
  }

  function renameHabit(id){
    const h = store.habits.find(x => x.id === id);
    if(!h) return;
    const next = prompt("Rename habit:", h.name);
    if(next === null) return;
    const t = next.trim();
    if(!t) return;
    h.name = t;
    saveStore();
    render();
  }

  function deleteHabit(id){
    const h = store.habits.find(x => x.id === id);
    if(!h) return;
    if(!confirm(`Delete "${h.name}"? This removes its history on this device.`)) return;
    store.habits = store.habits.filter(x => x.id !== id);
    delete store.checks[id];
    saveStore();
    render();
  }

  // ---------- toggling ----------
  function setChecked(habitId, dateKey, value){
    store.checks[habitId] = store.checks[habitId] || {};
    store.checks[habitId][dateKey] = !!value;
    saveStore();
  }

  function toggleCheck(habitId, dateKey){
    const cur = !!(store.checks[habitId] && store.checks[habitId][dateKey]);
    setChecked(habitId, dateKey, !cur);
  }

  function setRange(days){
    store.rangeDays = days;
    saveStore();
    render();
  }

  // ---------- paint / drag ----------
  let isPainting = false;
  let paintTargetValue = null;   // true = fill, false = clear
  let painted = new Set();       // avoid re-setting same cell during drag

  function startPaint(habitId, dateKey){
    isPainting = true;
    painted = new Set();

    const cur = !!(store.checks[habitId] && store.checks[habitId][dateKey]);
    paintTargetValue = !cur; // if starting cell is off -> paint on, else paint off

    setChecked(habitId, dateKey, paintTargetValue);
    painted.add(habitId + "|" + dateKey);
    render();
  }

  function paintOver(habitId, dateKey){
    if(!isPainting) return;
    const key = habitId + "|" + dateKey;
    if(painted.has(key)) return;
    setChecked(habitId, dateKey, paintTargetValue);
    painted.add(key);
    render();
  }

  function endPaint(){
    if(!isPainting) return;
    isPainting = false;
    paintTargetValue = null;
    painted.clear();
  }

  // ---------- render ----------
  const datesRowEl = document.getElementById("datesRow");
  const rowsEl = document.getElementById("rows");
  const rangeLabelEl = document.getElementById("rangeLabel");
  const subtitleEl = document.getElementById("subtitle");
  const emptyEl = document.getElementById("emptyState");
  const boardEl = document.getElementById("board");

  function renderRangeButtons(){
    ["r7","r14","r30"].forEach(id => document.getElementById(id).classList.remove("active"));
    document.getElementById(`r${store.rangeDays}`).classList.add("active");
  }

  function applyFillMode(){
    // Fill available width for 7d and 14d, keep scroll for 30d+
    if(store.rangeDays === 7 || store.rangeDays === 14){
      boardEl.classList.add("fillCols");
    } else {
      boardEl.classList.remove("fillCols");
    }
  }

  function syncHorizontalScroll(){
    // Only needed for scroll mode (30d+). If in fill mode, no-op.
    if(store.rangeDays === 7 || store.rangeDays === 14) return;

    const headerScroll = document.querySelector(".datesWrap");
    const rowScrolls = Array.from(document.querySelectorAll(".cellsWrap"));
    if(!rowScrolls.length) return;

    let isSyncing = false;
    function setAll(x){
      if(isSyncing) return;
      isSyncing = true;
      headerScroll.scrollLeft = x;
      rowScrolls.forEach(el => el.scrollLeft = x);
      isSyncing = false;
    }
    headerScroll.onscroll = () => setAll(headerScroll.scrollLeft);
    rowScrolls.forEach(el => { el.onscroll = () => setAll(el.scrollLeft); });
  }

  function render(){
    subtitleEl.textContent = formatSubtitle();
    rangeLabelEl.textContent = formatRangeLabel(store.rangeDays);
    renderRangeButtons();
    applyFillMode();

    const dates = getDateWindow(store.rangeDays);
    const todayKey = toKey(startOfDay(new Date()));

    // header
    datesRowEl.innerHTML = "";
    dates.forEach(d => {
      const key = toKey(d);
      const cell = document.createElement("div");
      cell.className = "dayCell" + (key === todayKey ? " today" : "");
      cell.innerHTML = `<div class="dow">${DOW[d.getDay()]}</div><div class="md">${MONTH[d.getMonth()]} ${d.getDate()}</div>`;
      datesRowEl.appendChild(cell);
    });

    // body
    rowsEl.innerHTML = "";
    emptyEl.style.display = store.habits.length ? "none" : "block";

    store.habits.forEach(h => {
      const rowWrap = document.createElement("div");
      rowWrap.className = "habitRow";

      const left = document.createElement("div");
      left.className = "habitCell";
      left.innerHTML = `
        <div class="habitName" title="${h.name.replaceAll('"','&quot;')}">${h.name}</div>
        <div class="habitBtns">
          <button class="iconBtn" type="button" title="Rename">✎</button>
          <button class="iconBtn" type="button" title="Delete">🗑</button>
        </div>
      `;
      const [renameBtn, deleteBtn] = left.querySelectorAll("button");
      renameBtn.addEventListener("click", () => renameHabit(h.id));
      deleteBtn.addEventListener("click", () => deleteHabit(h.id));

      const right = document.createElement("div");
      right.className = "cellsWrap";

      const row = document.createElement("div");
      row.className = "row";

      // compute tier for visible checked days based on TRUE segment length across all time
      const segmentTierByDay = computeSegmentTiers(h.id, dates);

      dates.forEach(d => {
        const k = toKey(d);
        const checked = !!(store.checks[h.id] && store.checks[h.id][k]);

        const cell = document.createElement("div");
        cell.className = "cell";

        const dot = document.createElement("div");
        dot.className = "dot";

        if(checked){
          const tier = segmentTierByDay[k];
          dot.classList.add("filled");
          if(tier) dot.classList.add(tier);
        }

        // Single click toggles (ignored if painting active)
        dot.addEventListener("click", () => {
          if(isPainting) return;
          toggleCheck(h.id, k);
          render();
        });

        // Paint behavior
        dot.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          dot.setPointerCapture?.(e.pointerId);
          startPaint(h.id, k);
        });

        dot.addEventListener("pointerenter", () => {
          paintOver(h.id, k);
        });

        dot.addEventListener("pointerup", endPaint);
        dot.addEventListener("pointercancel", endPaint);

        cell.appendChild(dot);
        row.appendChild(cell);
      });

      right.appendChild(row);
      rowWrap.appendChild(left);
      rowWrap.appendChild(right);
      rowsEl.appendChild(rowWrap);
    });

    syncHorizontalScroll();
  }

  // End paint if released anywhere
  window.addEventListener("pointerup", endPaint);
  window.addEventListener("pointercancel", endPaint);

  // Controls
  document.getElementById("addBtn").addEventListener("click", () => {
    const inp = document.getElementById("habitInput");
    addHabit(inp.value);
    inp.value = "";
    inp.focus();
  });
  document.getElementById("habitInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter") document.getElementById("addBtn").click();
  });

  document.getElementById("r7").addEventListener("click", () => setRange(7));
  document.getElementById("r14").addEventListener("click", () => setRange(14));
  document.getElementById("r30").addEventListener("click", () => setRange(30));

  render();
</script>
</body>
</html>
